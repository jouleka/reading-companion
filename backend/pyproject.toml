[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reading-companion-backend"
version = "0.1.0"
description = "Spoiler-safe reading companion — backend (FastAPI service productionizing the LIT cores)"
requires-python = ">=3.12"
# Runtime deps (ADR 0007 D-A12). Lower bounds = versions verified to co-install 2026-06-28.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.5",
    "openai>=2.0",
    "httpx>=0.27",          # direct: the anthropic provider transport in app/llm/client.py (not just openai's transitive)
    "lxml>=5.3",            # hardened EPUB parse (ADR 0007: ElementTree silent degrade is a chapter-loss risk)
    "python-multipart>=0.0.12",  # file upload
    "sqlite-vec>=0.1.9",     # production spoiler-prefiltered per-book KNN backend (LIT-34)
    "psycopg[binary]>=3.2",   # hosted PostgreSQL migration/runtime foundation (LIT-38)
    "joserfc>=1.7,<2",        # hosted OIDC ID-token signature verification (LIT-40)
    "boto3>=1.35",             # S3-compatible hosted source-object storage (LIT-43)
    "cryptography>=44",        # authenticated encryption for hosted filesystem objects (LIT-43)
]

[project.optional-dependencies]
dev = ["bandit>=1.9.4", "pip-audit>=2.10.1", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
reading-companion-hosted-worker = "app.hosted.worker:main"
reading-companion-credential-rewrap = "app.hosted.credentials:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: requires TEST_POSTGRES_DSN pointing at a real PostgreSQL server with pgvector",
]
