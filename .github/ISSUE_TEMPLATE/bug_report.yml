name: Bug report
description: Report a reproducible Reading Companion defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private books, databases, logs, or private infrastructure.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic text or a public-domain fixture and provide minimal steps.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        - Local
        - Hosted foundation
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit hash where you observed the problem.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Include relevant commands and redacted output.
